    <style>
      #app-boot {
        --boot-bg: #0b1524;
        --boot-fg: #f4f8fc;
        --boot-muted: #9db6cc;
        --boot-accent: #4db3e8;
        --boot-accent-soft: rgba(77, 179, 232, 0.18);
        --boot-warm: #f0b35a;
        position: fixed;
        inset: 0;
        z-index: 99999;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        padding: max(20px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
        box-sizing: border-box;
        background:
          radial-gradient(ellipse 90% 60% at 50% -10%, rgba(77, 179, 232, 0.28) 0%, transparent 55%),
          radial-gradient(ellipse 50% 40% at 100% 100%, rgba(240, 179, 90, 0.1) 0%, transparent 50%),
          radial-gradient(ellipse 45% 35% at 0% 85%, rgba(77, 179, 232, 0.12) 0%, transparent 50%),
          linear-gradient(165deg, #0e1a2c 0%, var(--boot-bg) 45%, #08101c 100%);
        color: var(--boot-muted);
        font-family: "Noto Sans Arabic", Tahoma, "Segoe UI", sans-serif;
        direction: rtl;
        overflow: hidden;
      }
      #app-boot::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.35;
        background-image:
          radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.09) 1px, transparent 0);
        background-size: 28px 28px;
        mask-image: radial-gradient(ellipse 75% 65% at 50% 42%, black 20%, transparent 75%);
        pointer-events: none;
      }
      #app-boot .boot-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(56px);
        pointer-events: none;
        animation: em-float 9s ease-in-out infinite;
      }
      #app-boot .boot-orb-a {
        width: 260px;
        height: 260px;
        top: 6%;
        right: -4%;
        background: rgba(77, 179, 232, 0.22);
      }
      #app-boot .boot-orb-b {
        width: 200px;
        height: 200px;
        bottom: 8%;
        left: -6%;
        background: rgba(240, 179, 90, 0.12);
        animation-duration: 11s;
        animation-direction: reverse;
      }
      #app-boot .boot-orb-c {
        width: 140px;
        height: 140px;
        top: 48%;
        left: 42%;
        background: rgba(77, 179, 232, 0.1);
        animation-duration: 8s;
      }
      #app-boot .boot-inner {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        width: min(360px, 100%);
        padding: 36px 28px 32px;
        border-radius: 28px;
        background:
          linear-gradient(160deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0.03) 100%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow:
          0 30px 60px -24px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }
      #app-boot .boot-logo-wrap {
        position: relative;
        width: 118px;
        height: 118px;
        margin-bottom: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app-boot .boot-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: var(--boot-accent);
        border-right-color: rgba(77, 179, 232, 0.25);
        animation: em-spin 1.35s linear infinite;
      }
      #app-boot .boot-ring-outer {
        inset: -8px;
        border-width: 1px;
        border-color: rgba(255, 255, 255, 0.08);
        border-top-color: rgba(255, 255, 255, 0.22);
        animation-duration: 12s;
      }
      #app-boot .boot-ring-inner {
        inset: 12px;
        border-bottom-color: var(--boot-warm);
        border-left-color: rgba(240, 179, 90, 0.35);
        border-top-color: transparent;
        border-right-color: transparent;
        animation-direction: reverse;
        animation-duration: 2.4s;
      }
      #app-boot .boot-mark {
        width: 76px;
        height: 76px;
        border-radius: 22px;
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.04));
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow:
          0 16px 36px -14px rgba(77, 179, 232, 0.55),
          0 0 0 6px var(--boot-accent-soft);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        animation: em-pulse 2.6s ease-in-out infinite;
      }
      #app-boot .boot-mark img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        padding: 9px;
        display: none;
      }
      #app-boot .boot-mark.has-logo img {
        display: block;
      }
      #app-boot .boot-mark.has-logo .boot-letter {
        display: none;
      }
      #app-boot .boot-letter {
        font-size: 1.85rem;
        font-weight: 800;
        color: var(--boot-fg);
        letter-spacing: -0.02em;
        text-shadow: 0 0 20px rgba(77, 179, 232, 0.55);
        font-family: "Noto Naskh Arabic", "Noto Sans Arabic", Tahoma, sans-serif;
      }
      #app-boot .boot-eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--boot-accent);
        margin: 0 0 10px;
        padding: 5px 12px;
        border-radius: 999px;
        background: var(--boot-accent-soft);
        border: 1px solid rgba(77, 179, 232, 0.22);
      }
      #app-boot .boot-eyebrow::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--boot-accent);
        box-shadow: 0 0 10px var(--boot-accent);
        animation: em-dot 1.4s ease-in-out infinite;
      }
      #app-boot .boot-title {
        margin: 0;
        font-size: clamp(1.2rem, 4.5vw, 1.45rem);
        font-weight: 800;
        color: var(--boot-fg);
        line-height: 1.4;
        font-family: "Noto Naskh Arabic", "Noto Sans Arabic", Tahoma, sans-serif;
        text-wrap: balance;
      }
      #app-boot .boot-sub {
        margin: 12px 0 0;
        max-width: 260px;
        font-size: 0.92rem;
        line-height: 1.85;
        color: var(--boot-muted);
        animation: em-fade 2.4s ease-in-out infinite;
      }
      #app-boot .boot-bar {
        margin-top: 26px;
        width: min(200px, 62vw);
        height: 5px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.25);
      }
      #app-boot .boot-bar-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--boot-accent), #7ec8ef, var(--boot-warm), var(--boot-accent));
        background-size: 220% 100%;
        box-shadow: 0 0 14px rgba(77, 179, 232, 0.45);
        animation: em-bar 1.5s ease-in-out infinite;
      }
      #app-boot .boot-dots {
        display: flex;
        gap: 7px;
        margin-top: 16px;
        justify-content: center;
      }
      #app-boot .boot-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--boot-accent);
        animation: em-dot 1.25s ease-in-out infinite;
      }
      #app-boot .boot-dots span:nth-child(2) {
        background: #7ec8ef;
        animation-delay: 0.2s;
      }
      #app-boot .boot-dots span:nth-child(3) {
        background: var(--boot-warm);
        animation-delay: 0.4s;
      }
      #app-boot .boot-line {
        position: absolute;
        left: 12%;
        right: 12%;
        bottom: 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(77, 179, 232, 0.45),
          rgba(240, 179, 90, 0.35),
          transparent
        );
        pointer-events: none;
      }
      @keyframes em-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes em-pulse {
        0%,
        100% {
          transform: scale(1);
          box-shadow:
            0 16px 36px -14px rgba(77, 179, 232, 0.45),
            0 0 0 6px var(--boot-accent-soft);
        }
        50% {
          transform: scale(1.035);
          box-shadow:
            0 20px 42px -12px rgba(77, 179, 232, 0.55),
            0 0 0 10px rgba(77, 179, 232, 0.1);
        }
      }
      @keyframes em-fade {
        0%,
        100% {
          opacity: 0.62;
        }
        50% {
          opacity: 1;
        }
      }
      @keyframes em-bar {
        0% {
          left: -42%;
        }
        100% {
          left: 105%;
        }
      }
      @keyframes em-dot {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.85);
        }
        50% {
          opacity: 1;
          transform: scale(1.15);
        }
      }
      @keyframes em-float {
        0%,
        100% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(-10px, 14px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-boot .boot-ring,
        #app-boot .boot-mark,
        #app-boot .boot-sub,
        #app-boot .boot-bar-fill,
        #app-boot .boot-dots span,
        #app-boot .boot-orb,
        #app-boot .boot-eyebrow::before {
          animation: none !important;
        }
        #app-boot .boot-bar-fill {
          left: 20%;
          width: 60%;
        }
      }
    </style>
    <div id="root"></div>
    <script>
      (function () {
        function applyTenantPwaFromCache(sub) {
          try {
            if (!sub) return;
            var raw = sessionStorage.getItem("tenant-public:" + sub);
            if (!raw) return;
            var json = JSON.parse(raw);
            var t = json && json.data && json.data.tenant;
            var teacher = json && json.data && json.data.teacher;
            var logo =
              (t && (t.favicon_url || t.icon_url || t.logo_url || t.avatar_url)) ||
              (teacher && (teacher.avatar || teacher.image)) ||
              null;
            var nice = String(sub).replace(/[-_]+/g, " ");
            var appTitle =
              (t && (t.display_name || t.name)) ||
              (teacher && teacher.name) ||
              nice;
            if (!appTitle && !logo) return;

            var metaApp = document.querySelector('meta[name="application-name"]');
            var metaApple = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (metaApp) metaApp.setAttribute("content", appTitle);
            if (metaApple) metaApple.setAttribute("content", String(appTitle).slice(0, 40));
            if (logo) {
              document.querySelectorAll('link[rel="apple-touch-icon"]').forEach(function (el) {
                el.href = logo;
              });
              var fav = document.querySelector('link[rel="icon"]');
              if (fav) fav.href = logo;
            }

            var branding = {
              subdomain: sub,
              name: appTitle,
              shortName: appTitle.length > 12 ? appTitle.slice(0, 11) + "…" : appTitle,
              description: "منصة " + appTitle + " التعليمية",
              iconUrl: logo,
              themeColor: "#3182CE",
              backgroundColor: "#ffffff",
            };

            // نفس الأصل — Chrome يعتمد عليه عند التثبيت (blob غير موثوق)
            var mlink = document.querySelector('link[rel="manifest"]');
            if (mlink) {
              mlink.href =
                "/manifest.webmanifest?tenant=" +
                encodeURIComponent(sub) +
                "&v=" +
                encodeURIComponent(String(appTitle).slice(0, 16));
              mlink.setAttribute("data-tenant-pwa-manifest", "true");
            }

            if (typeof caches !== "undefined") {
              caches.open("em-tenant-pwa-branding-v1").then(function (cache) {
                return cache.put(
                  "/__em_tenant_pwa_branding__.json",
                  new Response(JSON.stringify(branding), {
                    headers: {
                      "Content-Type": "application/json",
                      "Cache-Control": "no-store",
                    },
                  }),
                );
              }).catch(function () {});
            }
            if (navigator.serviceWorker && navigator.serviceWorker.controller) {
              navigator.serviceWorker.controller.postMessage({
                type: "SET_TENANT_PWA_BRANDING",
                branding: branding,
              });
            }
          } catch (e) {}
        }

        try {
          var host = (location.hostname || "").toLowerCase();
          var parts = host.split(".");
          var sub = "";
          if (host.indexOf("localhost") !== -1 && parts.length >= 2) sub = parts[0];
          else if (parts.length >= 3) sub = parts[0];
          var reserved = { www: 1, app: 1, api: 1, admin: 1 };
          var isTenant = Boolean(sub && !reserved[sub]);
          var path = (location.pathname || "/").replace(/\/+$/, "") || "/";
          var isLandingRoot = path === "/";
          var splashKey = isTenant ? "em-tenant-splash:" + sub : "";
          var alreadyShown = splashKey ? sessionStorage.getItem(splashKey) === "1" : true;

          // PWA مبكراً من الكاش (حتى لو ما ظهرت شاشة التحميل)
          if (isTenant) applyTenantPwaFromCache(sub);

          // شاشة التحميل الفاخرة: أول فتح لـ / على منصة مدرس فقط
          var showFancy =
            isTenant && isLandingRoot && !alreadyShown;

          document.documentElement.style.background = isTenant ? "#0b1524" : "";
          document.body.style.background = isTenant ? "#0b1524" : "";

          if (!showFancy) return;

          sessionStorage.setItem(splashKey, "1");

          var root = document.getElementById("root");
          if (!root) return;

          root.innerHTML =
            '<div id="app-boot" role="status" aria-live="polite" aria-busy="true" aria-label="جاري تجهيز المنصة">' +
            '<div class="boot-orb boot-orb-a" aria-hidden="true"></div>' +
            '<div class="boot-orb boot-orb-b" aria-hidden="true"></div>' +
            '<div class="boot-orb boot-orb-c" aria-hidden="true"></div>' +
            '<div class="boot-inner">' +
            '<div class="boot-logo-wrap" aria-hidden="true">' +
            '<div class="boot-ring boot-ring-outer"></div>' +
            '<div class="boot-ring"></div>' +
            '<div class="boot-ring boot-ring-inner"></div>' +
            '<div class="boot-mark" id="app-boot-mark">' +
            '<img id="app-boot-logo" alt="" />' +
            '<span class="boot-letter" id="app-boot-letter">E</span>' +
            "</div></div>" +
            '<p class="boot-eyebrow">جاري التجهيز</p>' +
            '<h1 class="boot-title" id="app-boot-title">منصتك التعليمية</h1>' +
            '<p class="boot-sub">نجهّز تجربتك بهدوء… لحظات قليلة ويظهر المحتوى</p>' +
            '<div class="boot-bar" aria-hidden="true"><div class="boot-bar-fill"></div></div>' +
            '<div class="boot-dots" aria-hidden="true"><span></span><span></span><span></span></div>' +
            "</div>" +
            '<div class="boot-line" aria-hidden="true"></div>' +
            "</div>";

          var nice = sub.replace(/[-_]+/g, " ");
          var title = document.getElementById("app-boot-title");
          var letter = document.getElementById("app-boot-letter");
          if (title) title.textContent = nice;
          if (letter) letter.textContent = (nice.charAt(0) || "م").toUpperCase();

          var raw = sessionStorage.getItem("tenant-public:" + sub);
          if (!raw) return;
          var json = JSON.parse(raw);
          var t = json && json.data && json.data.tenant;
          var teacher = json && json.data && json.data.teacher;
          var logo =
            (t && (t.favicon_url || t.icon_url || t.logo_url || t.avatar_url)) ||
            (teacher && (teacher.avatar || teacher.image)) ||
            null;
          var name =
            (teacher && teacher.name) ||
            (t && (t.display_name || t.subdomain)) ||
            nice;
          if (title && name) title.textContent = name;
          if (logo) {
            var img = document.getElementById("app-boot-logo");
            var mark = document.getElementById("app-boot-mark");
            if (img) {
              img.src = logo;
              img.onload = function () {
                if (mark) mark.classList.add("has-logo");
              };
            }
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
