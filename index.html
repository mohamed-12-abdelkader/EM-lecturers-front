  <body dir="rtl" lang="ar" translate="no">
    <style>
      #app-boot {
        position: fixed;
        inset: 0;
        z-index: 99999;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        padding: 24px;
        box-sizing: border-box;
        background:
          radial-gradient(ellipse 70% 55% at 50% 32%, rgba(0, 160, 227, 0.22) 0%, transparent 55%),
          radial-gradient(ellipse 45% 40% at 88% 82%, rgba(212, 225, 87, 0.14) 0%, transparent 50%),
          radial-gradient(ellipse 40% 35% at 8% 78%, rgba(0, 160, 227, 0.12) 0%, transparent 45%),
          #0a1628;
        color: #7eb8d9;
        font-family: "Noto Sans Arabic", Tahoma, "Segoe UI", sans-serif;
        direction: rtl;
        overflow: hidden;
      }
      #app-boot::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.28;
        background-image: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.14) 1px, transparent 0);
        background-size: 22px 22px;
        mask-image: radial-gradient(ellipse 80% 70% at 50% 45%, black, transparent);
        pointer-events: none;
      }
      #app-boot .boot-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(48px);
        pointer-events: none;
        animation: em-float 7s ease-in-out infinite;
      }
      #app-boot .boot-orb-a {
        width: 220px;
        height: 220px;
        top: 10%;
        right: 6%;
        background: rgba(0, 160, 227, 0.2);
      }
      #app-boot .boot-orb-b {
        width: 180px;
        height: 180px;
        bottom: 12%;
        left: 8%;
        background: rgba(212, 225, 87, 0.14);
        animation-duration: 8.5s;
        animation-direction: reverse;
      }
      #app-boot .boot-inner {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 320px;
        width: 100%;
      }
      #app-boot .boot-logo-wrap {
        position: relative;
        width: 132px;
        height: 132px;
        margin-bottom: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app-boot .boot-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: #00a0e3;
        border-right-color: rgba(0, 160, 227, 0.35);
        animation: em-spin 1.2s linear infinite;
      }
      #app-boot .boot-ring-outer {
        inset: -6px;
        border-width: 1px;
        border-color: rgba(255, 255, 255, 0.1);
        border-top-color: rgba(255, 255, 255, 0.28);
        animation-duration: 10s;
      }
      #app-boot .boot-ring-inner {
        inset: 14px;
        border-bottom-color: #d4e157;
        border-left-color: rgba(212, 225, 87, 0.4);
        border-top-color: transparent;
        border-right-color: transparent;
        animation-direction: reverse;
        animation-duration: 2.2s;
      }
      #app-boot .boot-mark {
        width: 84px;
        height: 84px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 20px 48px -16px rgba(0, 160, 227, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        animation: em-pulse 2.2s ease-in-out infinite;
      }
      #app-boot .boot-mark img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        padding: 10px;
        display: none;
      }
      #app-boot .boot-mark.has-logo img {
        display: block;
      }
      #app-boot .boot-mark.has-logo .boot-letter {
        display: none;
      }
      #app-boot .boot-letter {
        font-size: 2rem;
        font-weight: 800;
        color: #fff;
        letter-spacing: -0.02em;
        text-shadow: 0 0 24px rgba(0, 160, 227, 0.7);
        font-family: "Noto Naskh Arabic", "Noto Sans Arabic", Tahoma, sans-serif;
      }
      #app-boot .boot-eyebrow {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #7eb8d9;
        margin: 0 0 8px;
      }
      #app-boot .boot-title {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 800;
        color: #fff;
        line-height: 1.35;
        font-family: "Noto Naskh Arabic", "Noto Sans Arabic", Tahoma, sans-serif;
      }
      #app-boot .boot-sub {
        margin: 10px 0 0;
        font-size: 0.9rem;
        line-height: 1.7;
        color: #7eb8d9;
        animation: em-fade 2s ease-in-out infinite;
      }
      #app-boot .boot-bar {
        margin-top: 28px;
        width: min(220px, 70vw);
        height: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
        position: relative;
      }
      #app-boot .boot-bar-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 42%;
        border-radius: 999px;
        background: linear-gradient(90deg, #00a0e3, #d4e157, #00a0e3);
        background-size: 200% 100%;
        animation: em-bar 1.35s ease-in-out infinite;
      }
      #app-boot .boot-dots {
        display: flex;
        gap: 6px;
        margin-top: 14px;
        justify-content: center;
      }
      #app-boot .boot-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #00a0e3;
        animation: em-dot 1.1s ease-in-out infinite;
      }
      #app-boot .boot-dots span:nth-child(2) {
        background: #d4e157;
        animation-delay: 0.18s;
      }
      #app-boot .boot-dots span:nth-child(3) {
        animation-delay: 0.36s;
      }
      #app-boot .boot-line {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(0, 160, 227, 0.55), rgba(212, 225, 87, 0.55), transparent);
        pointer-events: none;
      }
      @keyframes em-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes em-pulse {
        0%,
        100% {
          transform: scale(1);
          box-shadow: 0 20px 48px -16px rgba(0, 160, 227, 0.45);
        }
        50% {
          transform: scale(1.04);
          box-shadow: 0 24px 56px -14px rgba(212, 225, 87, 0.35);
        }
      }
      @keyframes em-fade {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }
      @keyframes em-bar {
        0% {
          left: -45%;
        }
        100% {
          left: 105%;
        }
      }
      @keyframes em-dot {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.85);
        }
        50% {
          opacity: 1;
          transform: scale(1.15);
        }
      }
      @keyframes em-float {
        0%,
        100% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(-12px, 16px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-boot .boot-ring,
        #app-boot .boot-mark,
        #app-boot .boot-sub,
        #app-boot .boot-bar-fill,
        #app-boot .boot-dots span,
        #app-boot .boot-orb {
          animation: none !important;
        }
        #app-boot .boot-bar-fill {
          left: 20%;
          width: 60%;
        }
      }
    </style>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var host = (location.hostname || "").toLowerCase();
          var parts = host.split(".");
          var sub = "";
          if (host.indexOf("localhost") !== -1 && parts.length >= 2) sub = parts[0];
          else if (parts.length >= 3) sub = parts[0];
          var reserved = { www: 1, app: 1, api: 1, admin: 1 };
          var isTenant = Boolean(sub && !reserved[sub]);
          var path = (location.pathname || "/").replace(/\/+$/, "") || "/";
          var isLandingRoot = path === "/";
          var splashKey = isTenant ? "em-tenant-splash:" + sub : "";
          var alreadyShown = splashKey ? sessionStorage.getItem(splashKey) === "1" : true;

          // شاشة التحميل الفاخرة: أول فتح لـ / على منصة مدرس فقط
          var showFancy =
            isTenant && isLandingRoot && !alreadyShown;

          document.documentElement.style.background = isTenant ? "#0a1628" : "";
          document.body.style.background = isTenant ? "#0a1628" : "";

          if (!showFancy) return;

          sessionStorage.setItem(splashKey, "1");

          var root = document.getElementById("root");
          if (!root) return;

          root.innerHTML =
            '<div id="app-boot" role="status" aria-live="polite" aria-busy="true" aria-label="جاري تجهيز المنصة">' +
            '<div class="boot-orb boot-orb-a" aria-hidden="true"></div>' +
            '<div class="boot-orb boot-orb-b" aria-hidden="true"></div>' +
            '<div class="boot-inner">' +
            '<div class="boot-logo-wrap" aria-hidden="true">' +
            '<div class="boot-ring boot-ring-outer"></div>' +
            '<div class="boot-ring"></div>' +
            '<div class="boot-ring boot-ring-inner"></div>' +
            '<div class="boot-mark" id="app-boot-mark">' +
            '<img id="app-boot-logo" alt="" />' +
            '<span class="boot-letter" id="app-boot-letter">E</span>' +
            "</div></div>" +
            '<p class="boot-eyebrow">جاري التجهيز</p>' +
            '<h1 class="boot-title" id="app-boot-title">منصتك التعليمية</h1>' +
            '<p class="boot-sub">نجهّز تجربتك… لحظات ويظهر المحتوى</p>' +
            '<div class="boot-bar" aria-hidden="true"><div class="boot-bar-fill"></div></div>' +
            '<div class="boot-dots" aria-hidden="true"><span></span><span></span><span></span></div>' +
            "</div>" +
            '<div class="boot-line" aria-hidden="true"></div>' +
            "</div>";

          var nice = sub.replace(/[-_]+/g, " ");
          var title = document.getElementById("app-boot-title");
          var letter = document.getElementById("app-boot-letter");
          if (title) title.textContent = nice;
          if (letter) letter.textContent = (nice.charAt(0) || "م").toUpperCase();

          var raw = sessionStorage.getItem("tenant-public:" + sub);
          if (!raw) return;
          var json = JSON.parse(raw);
          var t = json && json.data && json.data.tenant;
          var teacher = json && json.data && json.data.teacher;
          var logo =
            (t && (t.favicon_url || t.icon_url || t.logo_url || t.avatar_url)) ||
            (teacher && (teacher.avatar || teacher.image)) ||
            null;
          var name =
            (teacher && teacher.name) ||
            (t && (t.display_name || t.subdomain)) ||
            nice;
          if (title && name) title.textContent = name;
          if (logo) {
            var img = document.getElementById("app-boot-logo");
            var mark = document.getElementById("app-boot-mark");
            if (img) {
              img.src = logo;
              img.onload = function () {
                if (mark) mark.classList.add("has-logo");
              };
            }
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
