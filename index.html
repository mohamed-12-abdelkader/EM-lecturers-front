    <script>
      /* فرض العربية فوراً قبل تحميل React — حتى لو لغة الجهاز إنجليزية */

        var html = document.documentElement;
        html.lang = "ar";
        html.dir = "rtl";
        html.setAttribute("translate", "no");

  </head>
  <body dir="rtl" lang="ar" translate="no">
    <style>
      #app-boot {
        --boot-bg: #ffffff;
        --boot-text: #718096;
        --boot-track: #ebf8ff;
        position: fixed;
        inset: 0;
        z-index: 99999;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        padding: max(20px, env(safe-area-inset-top)) 32px max(24px, env(safe-area-inset-bottom));
        box-sizing: border-box;
        background: var(--boot-bg);
        color: var(--boot-text);
        font-family: "Noto Sans Arabic", Tahoma, "Segoe UI", sans-serif;
        direction: rtl;
        overflow: hidden;
      }
      @media (prefers-color-scheme: dark) {
        #app-boot {
          --boot-bg: #171923;
          --boot-text: #a0aec0;
          --boot-track: rgba(255, 255, 255, 0.12);
        }
        #app-boot .boot-hero {
          mix-blend-mode: normal;
        }
      }
      #app-boot .boot-top-line {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(to left, #3182ce, #ed8936);
      }
      #app-boot .boot-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        animation: em-boot-pulse 2s ease-in-out infinite;
      }
      #app-boot .boot-hero-wrap {
        width: clamp(220px, 42vw, 300px);
        height: clamp(220px, 42vw, 300px);
        border-radius: 50%;
        overflow: hidden;
        margin-bottom: 16px;
      }
      #app-boot .boot-hero {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        user-select: none;
        -webkit-user-drag: none;
        mix-blend-mode: screen;
      }
      #app-boot .boot-text {
        margin: 0 0 24px;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--boot-text);
      }
      #app-boot .boot-bar {
        width: min(280px, 72vw);
        height: 4px;
        border-radius: 999px;
        background: var(--boot-track);
        overflow: hidden;
        position: relative;
      }
      #app-boot .boot-bar-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(to left, #3182ce, #ed8936);
        animation: em-boot-bar 1.2s ease-in-out infinite;
      }
      @keyframes em-boot-pulse {
        0%,
        100% {
          opacity: 0.88;
          transform: scale(0.98);
        }
        50% {
          opacity: 1;
          transform: scale(1.02);
        }
      }
      @keyframes em-boot-bar {
        0% {
          left: 0;
        }
        100% {
          left: 60%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-boot .boot-content,
        #app-boot .boot-bar-fill {
          animation: none !important;
        }
        #app-boot .boot-bar-fill {
          left: 20%;
          width: 60%;
        }
      }
    </style>
    <div id="root"></div>
    <script>
      (function () {
        function applyTenantPwaFromCache(sub) {
          try {
            if (!sub) return;
            var raw = sessionStorage.getItem("tenant-public:" + sub);
            if (!raw) return;
            var json = JSON.parse(raw);
            var t = json && json.data && json.data.tenant;
            var teacher = json && json.data && json.data.teacher;
            var logo =
              (t && (t.favicon_url || t.icon_url || t.logo_url || t.avatar_url)) ||
              (teacher && (teacher.avatar || teacher.image)) ||
              null;
            var nice = String(sub).replace(/[-_]+/g, " ");
            var appTitle =
              (t && (t.display_name || t.name)) ||
              (teacher && teacher.name) ||
              nice;
            if (!appTitle && !logo) return;

            var metaApp = document.querySelector('meta[name="application-name"]');
            var metaApple = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (metaApp) metaApp.setAttribute("content", appTitle);
            if (metaApple) metaApple.setAttribute("content", String(appTitle).slice(0, 40));
            if (logo) {
              document.querySelectorAll('link[rel="apple-touch-icon"]').forEach(function (el) {
                el.href = logo;
              });
              var fav = document.querySelector('link[rel="icon"]');
              if (fav) fav.href = logo;
            }

            var branding = {
              subdomain: sub,
              name: appTitle,
              shortName: appTitle.length > 12 ? appTitle.slice(0, 11) + "…" : appTitle,
              description: "منصة " + appTitle + " التعليمية",
              iconUrl: logo,
              themeColor: "#3182CE",
              backgroundColor: "#ffffff",
            };

            // نفس الأصل — Chrome يعتمد عليه عند التثبيت (blob غير موثوق)
            var mlink = document.querySelector('link[rel="manifest"]');
            if (mlink) {
              mlink.href =
                "/manifest.webmanifest?tenant=" +
                encodeURIComponent(sub) +
                "&v=" +
                encodeURIComponent(String(appTitle).slice(0, 16));
              mlink.setAttribute("data-tenant-pwa-manifest", "true");
            }

            if (typeof caches !== "undefined") {
              caches.open("em-tenant-pwa-branding-v1").then(function (cache) {
                return cache.put(
                  "/__em_tenant_pwa_branding__.json",
                  new Response(JSON.stringify(branding), {
                    headers: {
                      "Content-Type": "application/json",
                      "Cache-Control": "no-store",
                    },
                  }),
                );
              }).catch(function () {});
            }
            if (navigator.serviceWorker && navigator.serviceWorker.controller) {
              navigator.serviceWorker.controller.postMessage({
                type: "SET_TENANT_PWA_BRANDING",
                branding: branding,
              });
            }
          } catch (e) {}
        }

        try {
          var host = (location.hostname || "").toLowerCase();
          var parts = host.split(".");
          var sub = "";
          if (host.indexOf("localhost") !== -1 && parts.length >= 2) sub = parts[0];
          else if (parts.length >= 3) sub = parts[0];
          var reserved = { www: 1, app: 1, api: 1, admin: 1 };
          var isTenant = Boolean(sub && !reserved[sub]);
          var path = (location.pathname || "/").replace(/\/+$/, "") || "/";
          var isLandingRoot = path === "/";
          var splashKey = isTenant ? "em-tenant-splash:" + sub : "";
          var alreadyShown = splashKey ? sessionStorage.getItem(splashKey) === "1" : true;

          // PWA مبكراً من الكاش (حتى لو ما ظهرت شاشة التحميل)
          if (isTenant) applyTenantPwaFromCache(sub);

          // شاشة التحميل: أول فتح لـ / على منصة مدرس — نفس شكل BrandLoadingScreen
          var showFancy =
            isTenant && isLandingRoot && !alreadyShown;

          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var bootBg = prefersDark ? "#171923" : "#ffffff";

          document.documentElement.style.background = showFancy || isTenant ? bootBg : "";
          document.body.style.background = showFancy || isTenant ? bootBg : "";

          if (!showFancy) return;

          sessionStorage.setItem(splashKey, "1");

          var root = document.getElementById("root");
          if (!root) return;

          root.innerHTML =
            '<div id="app-boot" role="status" aria-live="polite" aria-busy="true" aria-label="جاري التحميل">' +
            '<div class="boot-top-line" aria-hidden="true"></div>' +
            '<div class="boot-content">' +
            '<div class="boot-hero-wrap">' +
            '<img class="boot-hero" src="/images/brand-loading-hero.png" alt="جاري التحميل" width="300" height="300" decoding="async" fetchpriority="high" />' +
            "</div>" +
            '<p class="boot-text">جاري التحميل…</p>' +
            "</div>" +
            '<div class="boot-bar" aria-hidden="true"><div class="boot-bar-fill"></div></div>' +
            "</div>";
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
